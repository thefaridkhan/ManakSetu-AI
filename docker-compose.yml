version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bis_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: standardsai
      MYSQL_USER: bisuser
      MYSQL_PASSWORD: bispassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bis_network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bis_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bis_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bis_backend_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://root:rootpassword@mysql:3306/standardsai"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "bis_intelligent_standards_jwt_secret_key_2026_super_secure_enterprise"
      AI_PROVIDER: "gemini"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "gemini-1.5-flash"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - bis_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bis_frontend_ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bis_network

volumes:
  mysql_data:
  redis_data:

networks:
  bis_network:
    driver: bridge
